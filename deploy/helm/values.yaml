replicaCount: 2
image:
  repository: ghcr.io/emjaay20/nexus-integration
  tag: latest
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
runtimeSecret: nexus-runtime
service:
  type: ClusterIP
  port: 3000
  targetPort: 3000
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75
serviceMonitor:
  enabled: false
  interval: 15s
