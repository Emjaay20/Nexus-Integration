# Apply only after provisioning the nexus-runtime Secret and setting an approved image digest.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nexus
  namespace: platform-system
spec:
  interval: 5m
  timeout: 3m
  chart:
    spec:
      chart: ./deploy/helm
      sourceRef:
        kind: GitRepository
        name: nexus-integration
        namespace: flux-system
      reconcileStrategy: Revision
      interval: 1m
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
      strategy: rollback
  values:
    replicaCount: 2
    image:
      repository: ghcr.io/emjaay20/nexus-integration
      # Promotion replaces this placeholder with the digest of the tested image.
      digest: "sha256:bbdf6e23baea75bdbcfb18d144eca9fbc015dc36898b252f70df61483b928744"
    runtimeSecret: nexus-runtime
