name: nexus-observability
services:
  collector:
    image: otel/opentelemetry-collector:0.123.0
    command: [--config=/etc/otel/config.yml]
    volumes: [./otel-collector.yml:/etc/otel/config.yml:ro]
    ports: ['127.0.0.1:14318:4318']
    mem_limit: 192m
  tempo:
    image: grafana/tempo:2.7.2
    command: [-config.file=/etc/tempo.yml]
    volumes: [./tempo.yml:/etc/tempo.yml:ro]
    ports: ['127.0.0.1:13200:3200']
    mem_limit: 384m
  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ['127.0.0.1:19090:9090']
    mem_limit: 256m
