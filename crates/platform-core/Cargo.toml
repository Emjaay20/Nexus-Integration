[package]
name = "nexus-platform-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "nexus_platform_core"
path = "src/lib.rs"

[[bin]]
name = "platform-core"
path = "src/main.rs"

[dependencies]
csv = "1.3"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
actix-web.workspace = true
actix-rt.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
arc-swap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
reqwest.workspace = true
thiserror.workspace = true
anyhow.workspace = true
uuid.workspace = true
chrono.workspace = true
futures-util.workspace = true
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.0", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
tracing-opentelemetry = { version = "0.34.0", default-features = false }

[dev-dependencies]
actix-http = "3"
actix-rt.workspace = true
